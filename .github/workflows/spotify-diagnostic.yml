name: Spotify App Remote diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Spotify integration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: spotify-app-remote-integration

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Rebuild Discord SDK AAR
        run: |
          set -euo pipefail
          test -f app/libs/discord-part-00
          cat app/libs/discord-part-* > app/libs/discord_partner_sdk.aar
          unzip -t app/libs/discord_partner_sdk.aar

      - name: Download Spotify SDK AARs
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            "https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-app-remote-release-0.8.0.aar" \
            --output app/libs/spotify-app-remote-release-0.8.0.aar
          curl --fail --location --retry 3 \
            "https://github.com/spotify/android-sdk/releases/download/v0.8.0-appremote_v2.1.0-auth/spotify-auth-release-2.1.0.aar" \
            --output app/libs/spotify-auth-release-2.1.0.aar
          test -s app/libs/spotify-app-remote-release-0.8.0.aar
          test -s app/libs/spotify-auth-release-2.1.0.aar
          unzip -t app/libs/spotify-app-remote-release-0.8.0.aar
          unzip -t app/libs/spotify-auth-release-2.1.0.aar

      - name: Prepare signing keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_FILE"
          printf '%s' "$KEYSTORE_FILE" | base64 -d > "$HOME/release.keystore"
          test -s "$HOME/release.keystore"

      - name: Build Standard Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew app:assembleStandardRelease \
            -Pandroid.injected.signing.store.file="$HOME/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Inspect final APK manifest and SDK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/standard/release/app-standard-universal-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          mkdir -p diagnostic
          {
            echo "Spotify App Remote diagnostic"
            echo "Workflow commit: ${GITHUB_SHA}"
            echo "Source branch: spotify-app-remote-integration"
            echo "APK: $APK"
            echo
            echo "=== Final merged APK manifest: package visibility ==="
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -A 4 -B 3 -E 'com.spotify.music|QUERY_ALL_PACKAGES' || true
            echo
            echo "=== APK DEX files ==="
            "$AAPT" list "$APK" | grep -E '^classes[0-9]*\\.dex$' || true
            echo
            echo "=== Spotify class names found inside APK DEX ==="
            found_dex=0
            while IFS= read -r dex; do
              case "$dex" in
                classes*.dex)
                  found_dex=1
                  echo "DEX: $dex"
                  unzip -p "$APK" "$dex" | strings | grep -E -m 40 'com/spotify/android/appremote|com/spotify/protocol|SpotifyAppRemote|CouldNotFindSpotifyApp' || true
                  ;;
              esac
            done < <("$AAPT" list "$APK")
            if [ "$found_dex" -eq 0 ]; then
              echo "WARNING: no classes*.dex files found in APK"
            fi
            echo
            echo "=== Spotify App Remote AAR classes.jar ==="
            if unzip -l app/libs/spotify-app-remote-release-0.8.0.aar | grep -q 'classes.jar'; then
              unzip -p app/libs/spotify-app-remote-release-0.8.0.aar classes.jar > /tmp/spotify-classes.jar
              jar tf /tmp/spotify-classes.jar | grep -E 'com/spotify/android/appremote|com/spotify/protocol' | head -60 || true
            else
              echo "ERROR: classes.jar not found in Spotify App Remote AAR"
            fi
            echo
            echo "=== Spotify Auth AAR classes.jar ==="
            if [ -f app/libs/spotify-auth-release-2.1.0.aar ]; then
              unzip -p app/libs/spotify-auth-release-2.1.0.aar classes.jar > /tmp/spotify-auth-classes.jar
              jar tf /tmp/spotify-auth-classes.jar | grep -E 'com/spotify' | head -40 || true
            else
              echo "ERROR: Spotify Auth AAR missing"
            fi
            echo
            echo "=== Source manifest query ==="
            grep -n -A 5 -B 2 'com.spotify.music' app/src/main/AndroidManifest.xml || true
            echo
            echo "=== SDK AAR archive check ==="
            unzip -t app/libs/spotify-app-remote-release-0.8.0.aar | tail -n 2
            echo
            echo "This report checks APK packaging and build inputs; runtime SDK detection requires device logs."
          } | tee diagnostic/spotify-diagnostic.txt
          cp "$APK" diagnostic/

      - name: Upload diagnostic report and APK
        uses: actions/upload-artifact@v4
        with:
          name: spotify-app-remote-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 7
