name: Spotify App Remote diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Rebuild Discord SDK AAR
        run: |
          set -euo pipefail
          test -f app/libs/discord-part-00
          cat app/libs/discord-part-* > app/libs/discord_partner_sdk.aar
          unzip -t app/libs/discord_partner_sdk.aar

      - name: Download Spotify SDK AARs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          RELEASE_API="https://api.github.com/repos/spotify/android-sdk/releases/tags/v0.8.0-appremote_v2.1.0-auth"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$RELEASE_API" --output /tmp/spotify-release.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/spotify-release.json"))
          assets = {a["name"]: a["browser_download_url"] for a in data.get("assets", [])}
          required = {
              "spotify-app-remote-release-0.8.0.aar": "app/libs/spotify-app-remote-release-0.8.0.aar",
              "spotify-auth-release-2.1.0.aar": "app/libs/spotify-auth-release-2.1.0.aar",
          }
          missing = [name for name in required if name not in assets]
          if missing:
              raise SystemExit("Missing official Spotify SDK release assets: " + ", ".join(missing))
          with open("/tmp/spotify-assets.tsv", "w") as f:
              for name, path in required.items():
                  f.write(assets[name] + "\t" + path + "\n")
          PY
          while IFS="$(printf '\t')" read -r url path; do
            curl --fail --location --retry 3 "$url" --output "$path"
            test -s "$path"
            unzip -t "$path"
          done < /tmp/spotify-assets.tsv

      - name: Prepare signing keystore
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_FILE"
          printf '%s' "$KEYSTORE_FILE" | base64 -d > "$HOME/release.keystore"
          test -s "$HOME/release.keystore"

      - name: Build Standard Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew app:assembleStandardRelease \
            -Pandroid.injected.signing.store.file="$HOME/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Inspect final APK manifest and SDK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/standard/release/app-standard-universal-release.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          mkdir -p diagnostic
          {
            echo "Spotify App Remote diagnostic"
            echo "Commit: $GITHUB_SHA"
            echo "APK: $APK"
            echo
            echo "=== Final merged APK manifest: package visibility ==="
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -A 4 -B 3 -E 'com.spotify.music|QUERY_ALL_PACKAGES' || true
            echo
            echo "=== Spotify SDK classes in final APK ==="
            "$AAPT" list "$APK" | grep -E 'classes[0-9]*\.dex|lib/arm64-v8a' | head -80 || true
            echo
            echo "=== Source manifest query ==="
            grep -n -A 5 -B 2 'com.spotify.music' app/src/main/AndroidManifest.xml || true
            echo
            echo "=== SDK AAR archive check ==="
            unzip -t app/libs/spotify-app-remote-release-0.8.0.aar | tail -n 2
            echo
            echo "This report verifies the APK manifest and build inputs; it cannot prove runtime SDK detection by itself."
          } | tee diagnostic/spotify-diagnostic.txt
          cp "$APK" diagnostic/

      - name: Upload diagnostic report and APK
        uses: actions/upload-artifact@v4
        with:
          name: spotify-app-remote-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 7
