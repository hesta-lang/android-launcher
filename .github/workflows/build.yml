name: Build launcher

on:
  workflow_dispatch:
  push:
    branches: '*'

jobs:
  build:
    strategy:
      matrix:
        config:
        - name: Release
          lower: release
          flavor: standard
          
        - name: Debug
          lower: debug
          flavor: standard

        - name: Release
          lower: release
          flavor: googlePlay
          
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Java JDK
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: 21
        distribution: temurin
        cache: gradle

    - name: Generate keystore file
      run: echo ${{secrets.KEYSTORE_FILE}} | base64 -d > ~/release.keystore

    - name: Show signing certificate SHA-1
      if: ${{ matrix.config.flavor == 'standard' && matrix.config.lower == 'release' }}
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: |
        set -euo pipefail
        keytool -list -v \
          -keystore "$HOME/release.keystore" \
          -storepass "$KEYSTORE_PASSWORD" \
          -alias "$KEY_ALIAS" \
          | grep -i 'SHA1:'

    - name: Rebuild Discord Social SDK AAR
      run: |
          set -e
          test -f app/libs/discord-part-00
          cat app/libs/discord-part-* > app/libs/discord_partner_sdk.aar
          unzip -t app/libs/discord_partner_sdk.aar

    - name: Rebuild Discord Social SDK AAR
      run: |
        set -e
        test -f app/libs/discord-part-00
        cat app/libs/discord-part-* > app/libs/discord_partner_sdk.aar
        unzip -t app/libs/discord_partner_sdk.aar

    - name: Inspect Discord Social SDK contents
      run: |
        echo "=== AAR entries ==="
        unzip -Z1 app/libs/discord_partner_sdk.aar | grep -Ei 'classes.jar|libs/|jni/|prefab|discordpp|libdiscord|headers' || true
        if unzip -Z1 app/libs/discord_partner_sdk.aar | grep -qx 'classes.jar'; then
          unzip -p app/libs/discord_partner_sdk.aar classes.jar > /tmp/discord-classes.jar
          unzip -l /tmp/discord-classes.jar | head -100
        else
          echo "No classes.jar at AAR root; checking libs/"
          unzip -Z1 app/libs/discord_partner_sdk.aar | grep -E '^libs/.*\.jar$' || true
        fi
        
    - name: Upload Discord Social SDK AAR
      if: ${{ matrix.config.flavor == 'standard' && matrix.config.lower == 'release' }}
      uses: actions/upload-artifact@v4
      with:
        name: discord-social-sdk-aar
        path: app/libs/discord_partner_sdk.aar
        if-no-files-found: error
        
    - name: Download Spotify App Remote SDK 0.8.0
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p app/libs
        RELEASE_API="https://api.github.com/repos/spotify/android-sdk/releases/tags/v0.8.0-appremote_v2.1.0-auth"
        curl --fail --location --retry 3 \
          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "$RELEASE_API" --output /tmp/spotify-release.json
        APP_REMOTE_URL="$(python3 -c 'import json; d=json.load(open("/tmp/spotify-release.json")); assets=d.get("assets", []); matches=[a["browser_download_url"] for a in assets if a["name"] == "spotify-app-remote-release-0.8.0.aar"]; print(matches[0] if matches else "")')"
        AUTH_URL="$(python3 -c 'import json; d=json.load(open("/tmp/spotify-release.json")); assets=d.get("assets", []); matches=[a["browser_download_url"] for a in assets if a["name"] == "spotify-auth-release-2.1.0.aar"]; print(matches[0] if matches else "")')"
        if [ -z "$APP_REMOTE_URL" ]; then
          echo "Spotify App Remote AAR not found in official release assets."
          python3 -c 'import json; print("\n".join(a["name"] for a in json.load(open("/tmp/spotify-release.json")).get("assets", [])))'
          exit 1
        fi
        curl --fail --location --retry 3 "$APP_REMOTE_URL" --output app/libs/spotify-app-remote-release-0.8.0.aar
        test -s app/libs/spotify-app-remote-release-0.8.0.aar
        unzip -t app/libs/spotify-app-remote-release-0.8.0.aar
        if [ -n "$AUTH_URL" ]; then
          curl --fail --location --retry 3 "$AUTH_URL" --output app/libs/spotify-auth-release-2.1.0.aar
          test -s app/libs/spotify-auth-release-2.1.0.aar
        else
          echo "Auth AAR not listed as a separate asset; continuing with App Remote AAR."
        fi
    - name: Fix gradle permissions
      run: chmod +x ./gradlew

    - name: Build project (standard)
      if: ${{ matrix.config.flavor == 'standard' }}
      run: |
        ./gradlew app:assembleStandard${{ matrix.config.name }} \
          -Pandroid.injected.signing.store.file="$HOME/release.keystore" \
          -Pandroid.injected.signing.store.password="${{secrets.KEYSTORE_PASSWORD}}" \
          -Pandroid.injected.signing.key.alias="${{secrets.KEY_ALIAS}}" \
          -Pandroid.injected.signing.key.password="${{secrets.KEY_PASSWORD}}"

    - name: Build project (Google Play)
      if: ${{ matrix.config.flavor == 'googlePlay' }}
      run: |
        ./gradlew app:bundleGooglePlayRelease -PdisableAbiSplits \
          -Pandroid.injected.signing.store.file="$HOME/release.keystore" \
          -Pandroid.injected.signing.store.password="${{secrets.KEYSTORE_PASSWORD}}" \
          -Pandroid.injected.signing.key.alias="${{secrets.KEY_ALIAS}}" \
          -Pandroid.injected.signing.key.password="${{secrets.KEY_PASSWORD}}"

    - name: Rename universal apk
      id: rename_apk_universal
      if: ${{ matrix.config.flavor == 'standard' }}
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        APK_PATH=${{github.workspace}}/app/build/outputs/apk/standard/${{ matrix.config.lower }}/app-standard-universal-${{ matrix.config.lower }}.apk
        OUT_PATH=${{github.workspace}}/geode-launcher-${{ matrix.config.lower }}-$SHORT_SHA.apk
        mv $APK_PATH $OUT_PATH
        echo "path=$OUT_PATH" >> $GITHUB_OUTPUT

    - name: Rename apk
      id: rename_apk
      if: ${{ matrix.config.flavor == 'standard' }}
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        APK_PATH=${{github.workspace}}/app/build/outputs/apk/standard/${{ matrix.config.lower }}/app-standard-armeabi-v7a-${{ matrix.config.lower }}.apk
        OUT_PATH=${{github.workspace}}/geode-launcher-${{ matrix.config.lower }}-android32-$SHORT_SHA.apk
        mv $APK_PATH $OUT_PATH
        echo "path=$OUT_PATH" >> $GITHUB_OUTPUT

    - name: Rename mappings
      id: rename_mappings
      if: ${{ matrix.config.flavor == 'standard' && matrix.config.lower == 'release' }}
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        MAPPING_PATH=${{github.workspace}}/app/build/outputs/mapping/standardRelease/mapping.txt
        OUT_PATH=${{github.workspace}}/mapping-${{ matrix.config.lower }}-$SHORT_SHA.txt
        mv $MAPPING_PATH $OUT_PATH
        echo "path=$OUT_PATH" >> $GITHUB_OUTPUT

    - name: Rename AAB
      id: rename_aab
      if: ${{ matrix.config.flavor == 'googlePlay' }}
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        AAB_PATH=${{github.workspace}}/app/build/outputs/bundle/googlePlayRelease/app-googlePlay-release.aab
        OUT_PATH=${{github.workspace}}/geode-launcher-${{ matrix.config.lower }}-$SHORT_SHA.aab
        mv $AAB_PATH $OUT_PATH
        echo "path=$OUT_PATH" >> $GITHUB_OUTPUT

    - name: Rename AAB mappings
      id: rename_aab_mappings
      if: ${{ matrix.config.flavor == 'googlePlay' }}
      run: |
        SHORT_SHA=${GITHUB_SHA::7}
        MAPPING_PATH=${{github.workspace}}/app/build/outputs/mapping/googlePlayRelease/mapping.txt
        OUT_PATH=${{github.workspace}}/mapping-${{ matrix.config.lower }}-$SHORT_SHA.txt
        mv $MAPPING_PATH $OUT_PATH
        echo "path=$OUT_PATH" >> $GITHUB_OUTPUT

    - name: Upload release build
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      if: ${{ matrix.config.flavor == 'standard' && matrix.config.lower == 'release' }}
      with:
        name: geode-launcher-${{ matrix.config.lower }}
        path: |
          ${{ steps.rename_apk_universal.outputs.path }}
          ${{ steps.rename_apk.outputs.path }}
          ${{ steps.rename_mappings.outputs.path }}

    - name: Upload debug build
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      if: ${{ matrix.config.flavor == 'standard' && matrix.config.lower == 'debug' }}
      with:
        name: geode-launcher-${{ matrix.config.lower }}
        path: |
          ${{ steps.rename_apk_universal.outputs.path }}
          ${{ steps.rename_apk.outputs.path }}

    - name: Upload Google Play build
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      if: ${{ matrix.config.flavor == 'googlePlay' }}
      with:
        name: geode-launcher-google-play
        path: |
          ${{ steps.rename_aab.outputs.path }}
          ${{ steps.rename_aab_mappings.outputs.path }}
